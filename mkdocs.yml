site_name: Platform Engineering on Kubernetes
site_description: A hands-on learning path for platform engineering on Kubernetes
site_url: https://gitopshub.github.io/platform-engineering-on-kubernetes/
repo_url: https://github.com/GitOpsHub/platform-engineering-on-kubernetes
repo_name: platform-engineering-on-kubernetes
edit_uri: edit/main/

# scripts/build-docs.sh copies the published files into site-src/ and keeps their relative
# layout, so links such as ../../docs/... still resolve. Run it instead of `mkdocs build`.
docs_dir: site-src
site_dir: site

# Lab 04 service templates are scaffolding copied by Backstage, not reading material.
exclude_docs: |
  labs/lab-04-service-catalog/templates/

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

