                format: date-time
                type: string
              namespace:
                description: Namespace is the generated namespace, "<tenant>-<name>".
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is one of Pending, Ready, Failed, Expired or Terminating.
                type: string
              url:
                description: URL is where the environment is served, e.g. https://<name>.<tenant>.<base-domain>.
                type: string
            type: object
