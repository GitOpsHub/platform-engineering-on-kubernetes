metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: environments.platform.mycompany.io
spec:
  group: platform.mycompany.io
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    shortNames:
    - env
    singular: environment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenant
      name: Tenant
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Environment is a short-lived or long-lived deployment target
          for a tenant.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EnvironmentSpec defines the desired state of an Environment.
            properties:
              cluster:
                description: |-
                  Cluster is the cluster this Environment is meant for. When set and the
                  operator was started with --cluster-name, only a matching operator reconciles it.
                type: string
              template:
                default: baseline
                description: |-
                  Template names the template set under templates/ used to render the
                  baseline objects. Only "baseline" is embedded.
                type: string
              tenant:
                description: |-
                  Tenant is the name of the owning Tenant. The generated namespace is named
