apiVersion: v1
kind: Service
metadata:
  name: policy-engine
  namespace: policy-system
  labels:
    app.kubernetes.io/name: policy-engine
spec:
  selector:
    app.kubernetes.io/name: policy-engine
  ports:
    - name: webhook
      port: 443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-engine
  namespace: policy-system
  labels:
    app.kubernetes.io/name: policy-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policy-engine
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: policy-engine
          # Pinned to the first release of this module. The image must be built and
          # pushed before deploying: make docker-build TAG=v0.1.0 && docker push.
          # Never use :latest here.
          image: ghcr.io/gitopshub/policy-engine:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --addr=:8443
            - --metrics-addr=:8080
            - --allowed-registries=ghcr.io/acme/
            - --max-replicas=10
          ports:
            - name: webhook
              containerPort: 8443
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: policy-engine-tls
