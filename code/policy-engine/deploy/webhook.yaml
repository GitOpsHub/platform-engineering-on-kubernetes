# ValidatingWebhookConfiguration. The API server calls it before persisting
# Tenants, Environments and Workloads. cert-manager injects the CA bundle.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: platform-policy-engine
  annotations:
    cert-manager.io/inject-ca-from: policy-system/policy-engine-tls
webhooks:
  - name: validate.platform.mycompany.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    # Fail closed: if the engine is unreachable, platform objects are rejected.
    failurePolicy: Fail
    timeoutSeconds: 5
    matchPolicy: Equivalent
    clientConfig:
      service:
        name: policy-engine
        namespace: policy-system
        path: /validate
        port: 443
    rules:
      - apiGroups: ["platform.mycompany.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["tenants", "environments", "workloads"]
        scope: "*"
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "policy-system"]
