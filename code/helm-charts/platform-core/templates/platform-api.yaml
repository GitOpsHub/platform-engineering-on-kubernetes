{{- if .Values.platformApi.enabled }}
{{- $api := .Values.platformApi }}
{{- $name := "platform-api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Values.controlPlane.namespace }}
  labels:
    {{- include "platform-core.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ $api.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "platform-core.selectorLabels" (dict "name" $name "root" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "platform-core.labels" . | nindent 8 }}
        {{- include "platform-core.selectorLabels" (dict "name" $name "root" .) | nindent 8 }}
      annotations:
        {{- with $api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $api.serviceAccount.name | default "platform-api" }}
      automountServiceAccountToken: true
      {{- with $api.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "platform-core.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "platform-core.selectorLabels" (dict "name" $name "root" .) | nindent 14 }}
      containers:
        - name: platform-api
          image: {{ include "platform-core.image" (dict "image" $api.image "root" .) | quote }}
          imagePullPolicy: {{ $api.image.pullPolicy }}
          securityContext:
            {{- include "platform-core.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $api.containerPort }}
              protocol: TCP
          args:
            - --addr=:{{ $api.containerPort }}
            - --log-level={{ $api.logLevel }}
            - --cors-credentials={{ $api.cors.credentials }}
            - --platform-admin-group={{ $api.platformAdminGroup }}
            {{- if $api.cors.origins }}
            - --cors-origins={{ $api.cors.origins }}
            {{- end }}
            {{- if $api.auth.existingSecret }}
            - --tokens-file=/etc/platform-api/tokens
            {{- end }}
          {{- if $api.auth.existingSecret }}
          volumeMounts:
            - name: tokens
              mountPath: /etc/platform-api
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml $api.resources | nindent 12 }}
      {{- if $api.auth.existingSecret }}
      volumes:
        - name: tokens
          secret:
            secretName: {{ $api.auth.existingSecret }}
      {{- end }}
      {{- with $api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Values.controlPlane.namespace }}
  labels:
    {{- include "platform-core.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  type: {{ $api.service.type }}
  selector:
    {{- include "platform-core.selectorLabels" (dict "name" $name "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ $api.service.port }}
      targetPort: http
      protocol: TCP
{{- if and $api.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ .Values.controlPlane.namespace }}
  labels:
    {{- include "platform-core.labels" . | nindent 4 }}
spec:
  minAvailable: {{ $api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "platform-core.selectorLabels" (dict "name" $name "root" .) | nindent 6 }}
{{- end }}
{{- end }}
