name: static-site
title: Static site
description: A static website served by an unprivileged nginx image, with a Workload CR and a catalog entry.
owner: platform-team
tags: [static, website, nginx]
parameters:
  - name: name
    description: Site name (DNS-1123 label)
    required: true
    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
  - name: owner
    description: Owning team, written to catalog-info.yaml
    required: true
    pattern: '^[a-z0-9][a-z0-9-]*$'
  - name: description
    description: One-line site description
    default: A static website
  - name: namespace
    description: Kubernetes namespace for the Workload
    default: default
    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
  - name: image
    description: Registry prefix for the container image
    default: ghcr.io/acme
  - name: baseImage
    description: Base web server image
    default: nginxinc/nginx-unprivileged:1.27-alpine
  - name: port
    description: Container port (the unprivileged nginx default is 8080)
    default: "8080"
    pattern: '^[0-9]+$'
  - name: replicas
    description: Desired replicas
    default: "2"
    pattern: '^[0-9]+$'
  - name: lifecycle
    description: Catalog lifecycle stage
    default: experimental
    enum: [experimental, production, deprecated]
