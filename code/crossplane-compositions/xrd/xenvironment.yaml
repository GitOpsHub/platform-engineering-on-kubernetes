# CompositeResourceDefinition: a tenant environment (namespace + quota) API.
# Developers create an `Environment` claim; the composition creates a Namespace and ResourceQuota
# through provider-kubernetes Object resources.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xenvironments.platform.mycompany.io
  labels:
    platform.mycompany.io/component: crossplane-compositions
spec:
  group: platform.mycompany.io
  names:
    kind: XEnvironment
    plural: xenvironments
  claimNames:
    kind: Environment
    plural: environments
  defaultCompositionRef:
    name: environment-kubernetes
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          description: "A tenant environment: a namespace with a resource quota."
          properties:
            spec:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: object
                  required:
                    - tenant
                    - environment
                  properties:
                    tenant:
                      type: string
                      description: Tenant name. Lowercase DNS label.
                      pattern: "^[a-z]([-a-z0-9]{0,30}[a-z0-9])?$"
                      maxLength: 32
                    environment:
                      type: string
                      description: Environment name.
                      enum: [dev, staging, prod]
                    cpuRequests:
                      type: string
                      description: Total CPU requests allowed in the namespace.
                      default: "4"
                    memoryRequests:
                      type: string
                      description: Total memory requests allowed in the namespace.
                      default: 8Gi
                    maxPods:
                      type: integer
                      description: Maximum number of pods in the namespace.
                      default: 50
                      minimum: 1
                      maximum: 500
            status:
              type: object
              properties:
                namespace:
                  type: string
                  description: Name of the Namespace created for this environment.
