# Grants full control over Tenants. Tenants are cluster-scoped; bind this only
# to platform administrators (it is intentionally NOT aggregated to "edit").
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tenant-operator
  name: tenant-editor-role
rules:
- apiGroups: [platform.mycompany.io]
  resources: [tenants]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [platform.mycompany.io]
  resources: [tenants/status]
  verbs: [get]
