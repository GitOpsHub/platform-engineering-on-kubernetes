replicaCount: 2

image:
  repository: ghcr.io/gitopshub/platform-api
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

logLevel: info
profiling: false

# Comma-separated list of browser origins allowed via CORS (empty = same-origin only).
cors:
  origins: ""
  credentials: false

auth:
  # Name of an existing Secret with a key "tokens" in 'token,subject[,groups]' lines.
  # Without it every resource request is rejected with 401 (the server still starts).
  existingSecret: ""

# Members of this group (from the token's groups) may create and delete Tenants.
# Everything else is evaluated by Kubernetes RBAC as the caller (impersonation).
# The group is always added to the impersonation allowlist below.
platformAdminGroup: platform-admins

# Impersonation scope. This is the only broad permission the platform-api
# ServiceAccount holds, so it is explicit. See README.md in this chart.
impersonation:
  # Subjects platform-api may act as. Required unless allowAnyUser is true.
  users: []
  # Groups platform-api may act as. Must be non-empty. Only these groups are
  # forwarded; any other IdP group is dropped. system:* is refused at render time.
  groups:
    - platform-admins
  # Explicit, unscoped opt-in: let platform-api impersonate any user. Off by default.
  allowAnyUser: false

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
