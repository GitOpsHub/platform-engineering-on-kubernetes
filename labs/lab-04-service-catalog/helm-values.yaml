# Values for the official Backstage Helm chart:
#   oci://ghcr.io/backstage/charts/backstage  (chart 2.10.2)
# Reference: https://github.com/backstage/charts/tree/main/charts/backstage
#
# deploy.sh adds --set-string for backstage.image.repository and
# backstage.image.tag, taken from BACKSTAGE_IMAGE. The image is built locally
# (see README) and loaded into kind, so no registry is involved.
backstage:
  replicas: 1
  image:
    registry: ""              # empty: use the local image name as-is
    repository: backstage-lab # overridden by deploy.sh
    tag: local                # overridden by deploy.sh
    pullPolicy: IfNotPresent
  # Same entrypoint as the packages/backend/Dockerfile generated by create-app.
  command: ["node", "packages/backend"]
  # backend config: the lab app-config (ConfigMap backstage-lab-config, created by deploy.sh)
  extraAppConfig:
    - filename: app-config.lab.yaml
      configMapRef: backstage-lab-config
  # POSTGRES_* and GITHUB_TOKEN come from this Secret (created by deploy.sh)
  extraEnvVarsSecrets:
    - backstage-env
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

# Postgres runs from postgres.yaml, not from the chart's Bitnami sub-chart.
postgresql:
  enabled: false

ingress:
  enabled: true
  className: traefik
  host: backstage.localtest.me
