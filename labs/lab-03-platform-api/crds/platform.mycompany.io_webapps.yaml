---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: webapps.platform.mycompany.io
spec:
  group: platform.mycompany.io
  names:
    categories:
    - platform
    kind: WebApp
    listKind: WebAppList
    plural: webapps
    shortNames:
    - wa
    singular: webapp
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .spec.replicas
      name: Desired
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WebApp is a stateless web workload. The platform turns it into a Deployment
          and a Service, so application teams never write those objects directly.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WebAppSpec is the desired state of a WebApp.

              The CEL rules run in the API server, so an invalid WebApp is rejected by
              kubectl before any controller sees it.
            properties:
              image:
                description: |-
                  Image is the container image to run. It must include an explicit tag
                  or digest, and the :latest tag is rejected.
                maxLength: 255
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: image must not use the :latest tag
                  rule: '!self.endsWith('':latest'')'
                - message: image must include an explicit tag or digest
                  rule: self.contains(':') || self.contains('@')
              port:
                default: 8080
                description: Port is the port the container listens on. The Service
                  maps port 80 to it.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              replicas:
                default: 1
                description: Replicas is the number of pods to run.
                format: int32
                maximum: 10
                minimum: 0
                type: integer
            required:
            - image
            type: object
          status:
            description: WebAppStatus is the observed state of a WebApp, written by
              the controller.
            properties:
              conditions:
                description: Conditions describe the current state, for example Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation the controller
                  last acted on.
                format: int64
                type: integer
              readyReplicas:
                description: ReadyReplicas is the number of pods that are ready.
                format: int32
                type: integer
              url:
                description: URL is the in-cluster address of the Service.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
