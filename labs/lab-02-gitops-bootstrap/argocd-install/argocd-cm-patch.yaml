# Lab-friendly Argo CD settings.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # Poll Git every 60s instead of the default 120s so changes show up quickly.
  timeout.reconciliation: 60s
  # Let the "admin" account exist (it is used for the first login only).
  admin.enabled: "true"
  # Health check for Application resources. Without it, sync waves in an
  # app-of-apps don't wait for child Applications to become Healthy.
  # https://argo-cd.readthedocs.io/en/stable/operator-manual/health/#argocd-app
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
