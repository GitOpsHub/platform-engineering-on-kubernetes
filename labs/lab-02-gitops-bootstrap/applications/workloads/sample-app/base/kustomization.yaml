apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
labels:
  - pairs:
      app.kubernetes.io/name: sample-app
      app.kubernetes.io/part-of: lab-02
    includeSelectors: true
configMapGenerator:
  - name: sample-app-config
    literals:
      - GREETING=hello
