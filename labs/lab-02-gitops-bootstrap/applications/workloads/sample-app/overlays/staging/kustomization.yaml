# staging overlay - picked up automatically by the sample-app ApplicationSet.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      platform.mycompany.io/environment: staging
    includeSelectors: false
replicas:
  - name: sample-app
    count: 2
configMapGenerator:
  - name: sample-app-config
    behavior: merge
    literals:
      - GREETING=hello from staging
