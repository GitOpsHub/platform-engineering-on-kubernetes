# Edit the message, commit, push - Argo CD rolls it out within ~60s.
# (The Deployment won't restart on its own; nginx serves the updated file
# once the kubelet refreshes the ConfigMap volume, usually within a minute.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: guestbook-content
  labels:
    app.kubernetes.io/name: guestbook
data:
  index.html: |
    <!doctype html>
    <html><head><title>Guestbook</title></head>
    <body style="font-family: sans-serif">
      <h1>Hello from GitOps!</h1>
      <p>This page is deployed by Argo CD from
      <code>labs/lab-02-gitops-bootstrap/applications/workloads/guestbook</code>.</p>
    </body></html>
