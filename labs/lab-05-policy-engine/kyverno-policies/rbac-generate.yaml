# Grants Kyverno's background controller permission to manage the resources
# created by generate-tenant-defaults.yaml. The Kyverno Helm chart aggregates
# every ClusterRole carrying this label into the controller's role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:lab05-generate-tenant-defaults
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    platform.mycompany.io/lab: lab-05-policy-engine
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
