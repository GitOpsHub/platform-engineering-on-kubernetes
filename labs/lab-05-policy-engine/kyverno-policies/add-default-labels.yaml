# Kyverno MUTATE: add default labels and a safe imagePullPolicy.
# The "+( )" anchor only adds a field when it is not already set, so values
# supplied by developers always win.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-labels
  labels:
    platform.mycompany.io/lab: lab-05-policy-engine
  annotations:
    policies.kyverno.io/title: Add Default Labels
    policies.kyverno.io/category: Platform Defaults
    policies.kyverno.io/subject: Pod
spec:
  rules:
    - name: add-environment-and-managed-by
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["policy-test-kyverno"]
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              +(platform.mycompany.io/environment): dev
              +(platform.mycompany.io/policy-mutated): "true"
          spec:
            containers:
              - (name): "*"
                +(imagePullPolicy): IfNotPresent
