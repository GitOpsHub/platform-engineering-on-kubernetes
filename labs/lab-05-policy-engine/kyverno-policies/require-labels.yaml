# Kyverno VALIDATE: Pods must carry a team label.
# Uses the kyverno.io/v1 ClusterPolicy (pattern-based) style. For the CEL-based
# style see validatingpolicy-disallow-privileged.yaml.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-team-label
  labels:
    platform.mycompany.io/lab: lab-05-policy-engine
  annotations:
    policies.kyverno.io/title: Require Team Label
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every Pod must declare the owning team via the platform.mycompany.io/team
      label so costs, alerts and incidents can be routed.
spec:
  background: true
  rules:
    - name: check-team-label
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["policy-test-kyverno"]
      validate:
        failureAction: Enforce
        message: "[kyverno] the label 'platform.mycompany.io/team' is required."
        pattern:
          metadata:
            labels:
              platform.mycompany.io/team: "?*"
