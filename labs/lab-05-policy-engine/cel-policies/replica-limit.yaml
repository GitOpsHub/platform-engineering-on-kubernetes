# Deployment replica cap with an audit annotation and a matchCondition that
# exempts system users. Limit comes from a ConfigMap parameter.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: lab05-replica-limit
  labels:
    platform.mycompany.io/lab: lab-05-policy-engine
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  matchConditions:
    - name: exclude-system-users
      expression: "!request.userInfo.username.startsWith('system:')"
  validations:
    - expression: "object.spec.replicas <= int(params.data['maxReplicas'])"
      messageExpression: >-
        '[cel] replicas must be <= ' + params.data['maxReplicas'] +
        ', got ' + string(object.spec.replicas)
      reason: Invalid
  auditAnnotations:
    - key: high-replica-count
      valueExpression: >-
        object.spec.replicas > int(params.data['maxReplicas']) / 2 ?
        'deployment ' + object.metadata.name + ' requests ' + string(object.spec.replicas) + ' replicas' : null
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: replica-limit
  namespace: policy-test-cel
  labels:
    platform.mycompany.io/lab: lab-05-policy-engine
data:
  maxReplicas: "5"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: lab05-replica-limit
  labels:
    platform.mycompany.io/lab: lab-05-policy-engine
spec:
  policyName: lab05-replica-limit
  # Deny blocks the request; Audit additionally records the violation in the
  # API server audit log.
  validationActions: ["Deny", "Audit"]
  paramRef:
    name: replica-limit
    namespace: policy-test-cel
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: policy-test-cel
