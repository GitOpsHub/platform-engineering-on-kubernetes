apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sDisallowedTags
metadata:
  name: disallow-latest-tag
  labels:
    platform.mycompany.io/lab: lab-05-policy-engine
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces: ["policy-test-gatekeeper"]
  parameters:
    tags: ["latest"]
    exemptImages: []
