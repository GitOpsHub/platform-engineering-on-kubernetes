# Grafana Alloy for Lab 06 (chart grafana/alloy 1.12.1, Alloy v1.19.2).
# Ships pod logs from the Kubernetes API to Loki. A Helm values file belongs to one
# release, so Alloy gets its own file instead of living inside loki-stack.yaml.
#   helm upgrade --install alloy alloy --repo https://grafana.github.io/helm-charts \
#     --version 1.12.1 -n platform-monitoring -f alloy-logs.yaml --wait
#
# Deployment (1 replica) rather than DaemonSet: loki.source.kubernetes reads every pod
# through the API, so one instance is enough and no host log mounts are needed.
controller:
  type: deployment
  replicas: 1

alloy:
  enableReporting: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.platform-monitoring.svc:3100/loki/api/v1/push"
        }
      }
